name: fantasy
description: "Fantasy FPL - Premier League Manager App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  cached_network_image: ^3.4.0
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.7.0
  equatable: ^2.0.5
  fl_chart: ^0.70.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  flutter_svg: ^2.3.0
  get_it: ^8.0.0
  go_router: ^14.0.0
  google_fonts: ^6.2.0
  hydrated_bloc: ^11.0.0
  path_provider: ^2.1.6
  shared_preferences: ^2.3.0
  shimmer: ^3.0.0
  skeletonizer: ^2.1.3

dev_dependencies:
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svg/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/fantaxi.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/fantaxi.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/fantaxi.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/fantaxi.png"
